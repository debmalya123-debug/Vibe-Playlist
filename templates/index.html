<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePlaylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">

    <!-- Fluid Background -->
    <div class="fluid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-7xl flex flex-col md:flex-row gap-8 relative z-10">
        
        <!-- Left Panel: Upload & Info -->
        <div class="w-full md:w-1/3 flex flex-col space-y-6">
            <div class="text-center md:text-left mb-2">
                <h1 class="text-5xl md:text-6xl font-bold tracking-tight mb-2 bg-clip-text text-transparent bg-gradient-to-r from-white to-white/70">VibePlaylist</h1>
                <p class="text-white/70 text-lg font-light">See the vibe. Hear the vibe.</p>
            </div>
            
            <div class="glass-card p-6 flex-grow flex flex-col">
                <form id="uploadForm" class="flex flex-col space-y-6 h-full">
                    <label for="imageInput" class="upload-area flex-grow rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden group min-h-[300px] md:min-h-[400px]">
                        <!-- Image Preview -->
                        <img id="previewImage" class="absolute inset-0 w-full h-full object-cover hidden z-20 transition-opacity duration-500" />
                        
                        <!-- Placeholder -->
                        <div id="uploadPlaceholder" class="flex flex-col items-center p-6 text-center z-10 transition-opacity duration-300 group-hover:scale-105">
                            <div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center mb-4 backdrop-blur-sm border border-white/10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <span class="text-xl font-medium text-white mb-2">Drop your image here</span>
                            <span class="text-sm text-white/50 bg-white/10 px-3 py-1 rounded-full">or click to browse</span>
                        </div>
                        <input type="file" id="imageInput" name="image" accept="image/*" class="hidden" required>
                    </label>
                    
                    <!-- Model Selection -->
                    <div class="mb-6">
                        <label class="block text-white/60 text-xs font-bold uppercase tracking-wider mb-2">Select Vibe Engine</label>
                        <div class="flex bg-white/5 p-1 rounded-lg border border-white/10 relative">
                            <input type="radio" name="model_type" id="model_gemini" value="gemini" class="peer/gemini hidden" checked>
                            <label for="model_gemini" class="flex-1 text-center py-2 text-sm font-medium text-white/60 cursor-pointer rounded-md transition-all peer-checked/gemini:bg-white/10 peer-checked/gemini:text-white peer-checked/gemini:shadow-sm hover:text-white/80">
                                Gemini
                            </label>
                            
                            <input type="radio" name="model_type" id="model_custom" value="custom_ai" class="peer/custom hidden">
                            <label for="model_custom" class="flex-1 text-center py-2 text-sm font-medium text-white/60 cursor-pointer rounded-md transition-all peer-checked/custom:bg-white/10 peer-checked/custom:text-white peer-checked/custom:shadow-sm hover:text-white/80">
                                Custom AI
                            </label>
                        </div>
                    </div>

                    <button type="submit" id="analyzeBtn" class="w-full py-4 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-xl font-bold text-white shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 transform hover:scale-[1.02] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden">
                        <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                        <span class="relative flex items-center justify-center gap-2" id="btnText">
                            Generate Playlist
                        </span>
                        <span id="loader" class="loader ml-3 hidden"></span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Panel: Results -->
        <div class="w-full md:w-2/3 glass-card p-6 md:p-8 flex flex-col min-h-[500px] relative overflow-hidden">
            
            <!-- Empty State -->
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-white/30 pointer-events-none p-8 text-center">
                <div class="w-24 h-24 rounded-full bg-white/5 flex items-center justify-center mb-6 animate-pulse">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                    </svg>
                </div>
                <p class="text-2xl font-light">Your playlist awaits...</p>
                <p class="text-sm mt-2 opacity-60">Upload an image to start the vibe.</p>
            </div>

            <!-- Results Content -->
            <div id="resultsPanel" class="flex flex-col h-full hidden opacity-0 transition-opacity duration-700 ease-out">
                <div class="mb-6">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-white/50 font-bold mb-3">Vibe Analysis</h2>
                    <p id="moodDescription" class="text-xl md:text-2xl font-light leading-tight text-white/90 mb-4"></p>
                    
                    <div class="flex flex-wrap gap-2 mb-4" id="genreTags">
                        <!-- Genres will be injected here -->
                    </div>

                    <!-- Vibe Tuner Controls -->
                    <div class="flex flex-wrap gap-2">
                        <button onclick="refineVibe('More Energetic')" class="px-3 py-1.5 bg-white/5 hover:bg-white/20 rounded-lg text-xs font-medium transition-colors border border-white/10">⚡ More Energy</button>
                        <button onclick="refineVibe('Chill Out')" class="px-3 py-1.5 bg-white/5 hover:bg-white/20 rounded-lg text-xs font-medium transition-colors border border-white/10">🧊 Chill Out</button>
                        <button onclick="refineVibe('Darker')" class="px-3 py-1.5 bg-white/5 hover:bg-white/20 rounded-lg text-xs font-medium transition-colors border border-white/10">🌑 Darker</button>
                        <button onclick="refineVibe('Happier')" class="px-3 py-1.5 bg-white/5 hover:bg-white/20 rounded-lg text-xs font-medium transition-colors border border-white/10">☀️ Happier</button>
                    </div>
                </div>
                
                <div class="flex-grow overflow-y-auto pr-2 -mr-2 space-y-3 custom-scrollbar" id="tracksList">
                    <!-- Spotify Embeds will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const imageInput = document.getElementById('imageInput');
        const previewImage = document.getElementById('previewImage');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const resultsPanel = document.getElementById('resultsPanel');
        const emptyState = document.getElementById('emptyState');
        const moodDescription = document.getElementById('moodDescription');
        const genreTags = document.getElementById('genreTags');
        const tracksList = document.getElementById('tracksList');

        // Image Preview Logic
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.classList.remove('hidden');
                    // Hide placeholder when image is shown
                    uploadPlaceholder.classList.add('opacity-0'); 
                }
                reader.readAsDataURL(file);
            }
        });

        // Form Submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            setLoading(true);
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResults(data);
                } else {
                    alert('Error: ' + (data.error || 'Something went wrong'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while communicating with the server.');
            } finally {
                setLoading(false);
            }
        });

        async function refineVibe(modifier) {
            const currentMood = moodDescription.textContent;
            setLoading(true, `Tuning Vibe: ${modifier}...`);
            
            try {
                const response = await fetch('/refine', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        mood: currentMood,
                        modifier: modifier
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResults(data);
                } else {
                    alert('Error: ' + (data.error || 'Something went wrong'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while refining the vibe.');
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading, text = 'Analyzing Vibe...') {
            if (isLoading) {
                analyzeBtn.disabled = true;
                btnText.textContent = text;
                loader.classList.remove('hidden');
                resultsPanel.classList.add('hidden');
                resultsPanel.classList.remove('opacity-100');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('animate-pulse');
            } else {
                analyzeBtn.disabled = false;
                btnText.textContent = 'Generate Playlist';
                loader.classList.add('hidden');
                emptyState.classList.remove('animate-pulse');
            }
        }

        function displayResults(data) {
            emptyState.classList.add('hidden');
            
            // 1. Mood & Genres
            moodDescription.textContent = data.mood;
            
            genreTags.innerHTML = '';
            data.genres.forEach(genre => {
                const span = document.createElement('span');
                span.className = 'px-4 py-1.5 bg-white/10 border border-white/20 rounded-full text-sm font-medium backdrop-blur-md hover:bg-white/20 transition-colors cursor-default';
                span.textContent = genre;
                genreTags.appendChild(span);
            });

            // 2. Tracks (Spotify Embeds)
            tracksList.innerHTML = '';
            data.tracks.forEach((track, index) => {
                // Create Embed Container
                const container = document.createElement('div');
                container.className = 'w-full bg-white/5 rounded-xl overflow-hidden hover:bg-white/10 transition-all border border-white/5 animate-fade-in-up shadow-sm hover:shadow-md';
                container.style.animationDelay = `${index * 100}ms`;

                if (track.id) {
                    // Use Spotify Embed
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://open.spotify.com/embed/track/${track.id}?utm_source=generator&theme=0`;
                    iframe.width = "100%";
                    iframe.height = "80";
                    iframe.frameBorder = "0";
                    iframe.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
                    iframe.loading = "lazy";
                    iframe.className = "rounded-xl"; 
                    
                    container.appendChild(iframe);
                } else {
                    // Fallback
                    container.innerHTML = `
                        <div class="p-4 flex items-center gap-4">
                            <img src="${track.album_art || 'https://via.placeholder.com/48'}" class="w-12 h-12 rounded object-cover opacity-50">
                            <div>
                                <h4 class="font-semibold text-white/70">${track.name}</h4>
                                <p class="text-sm text-white/50">${track.artist}</p>
                            </div>
                        </div>
                    `;
                }
                
                tracksList.appendChild(container);
            });

            resultsPanel.classList.remove('hidden');
            // Trigger reflow
            void resultsPanel.offsetWidth; 
            resultsPanel.classList.add('opacity-100');
        }
    </script>
    
    <style>
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; 
        }
        
        /* Custom Scrollbar for tracks list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</body>
</html>
