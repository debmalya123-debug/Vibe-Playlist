<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePlaylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">

    <!-- Fluid Background -->
    <div class="fluid-bg">
        <canvas id="moodCanvas" class="mood-canvas"></canvas>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-7xl flex flex-col md:flex-row gap-8 relative z-10">
        
        <!-- Left Panel: Upload & Info -->
        <div class="w-full md:w-1/3 flex flex-col space-y-6">
            <div class="text-center md:text-left mb-2">
                <h1 class="text-5xl md:text-6xl font-bold tracking-tight mb-2 gradient-text glow">VibePlaylist</h1>
                <p class="text-white/70 text-lg font-light">See the vibe. Hear the vibe.</p>
            </div>
            
            <div class="glass-card p-6 flex-grow flex flex-col">
                <form id="uploadForm" class="flex flex-col space-y-6 h-full">
                    <div class="upload-area flex-grow rounded-2xl flex flex-col items-center justify-center relative overflow-hidden min-h-[300px] md:min-h-[400px]">
                        <!-- Image Preview -->
                        <img id="previewImage" class="absolute inset-0 w-full h-full object-cover hidden z-20 transition-opacity duration-500" />
                        
                        <!-- Camera Feed -->
                        <video id="cameraFeed" class="absolute inset-0 w-full h-full object-cover hidden z-20" autoplay playsinline></video>
                        
                        <!-- Placeholder -->
                        <div id="uploadPlaceholder" class="flex flex-col items-center p-6 text-center z-10 transition-opacity duration-300">
                            <div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center mb-4 backdrop-blur-sm border border-white/10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <span class="text-xl font-medium text-white mb-4">Capture or Upload</span>
                            
                            <!-- Upload and Camera Buttons -->
                            <div class="flex gap-3 flex-wrap justify-center">
                                <label for="imageInput" class="cursor-pointer bg-white/10 hover:bg-white/20 px-5 py-2.5 rounded-lg text-sm font-medium transition-all border border-white/20 backdrop-blur-sm flex items-center gap-2 group">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                    </svg>
                                    Upload
                                </label>
                                <button type="button" id="cameraBtn" class="bg-white/10 hover:bg-white/20 px-5 py-2.5 rounded-lg text-sm font-medium transition-all border border-white/20 backdrop-blur-sm flex items-center gap-2 group">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                    Camera
                                </button>
                            </div>
                        </div>
                        
                        <!-- Camera Controls (shown when camera is active) -->
                        <div id="cameraControls" class="absolute bottom-6 left-0 right-0 z-30 hidden">
                            <div class="flex justify-center gap-4 items-center">
                                <button type="button" id="flipCameraBtn" class="w-14 h-14 rounded-full bg-white/20 hover:bg-white/30 shadow-lg transition-all transform hover:scale-110 flex items-center justify-center backdrop-blur-sm border border-white/30">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                    </svg>
                                </button>
                                <button type="button" id="captureBtn" class="w-16 h-16 rounded-full bg-white hover:bg-white/90 shadow-xl transition-all transform hover:scale-110 flex items-center justify-center group">
                                    <div class="w-14 h-14 rounded-full border-4 border-gray-800 group-hover:border-gray-900"></div>
                                </button>
                                <button type="button" id="closeCameraBtn" class="w-14 h-14 rounded-full bg-red-500/80 hover:bg-red-500 shadow-lg transition-all transform hover:scale-110 flex items-center justify-center backdrop-blur-sm border border-red-600/50">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        
                        <input type="file" id="imageInput" name="image" accept="image/*" class="hidden">
                    </div>
                    
                    <!-- Model Selection -->
                    <div class="mb-6">
                        <label class="block text-white/60 text-xs font-bold uppercase tracking-wider mb-2">Select Vibe Engine</label>
                        <div class="flex bg-white/5 p-1 rounded-lg border border-white/10 relative">
                            <input type="radio" name="model_type" id="model_gemini" value="gemini" class="peer/gemini hidden" checked>
                            <label for="model_gemini" class="flex-1 text-center py-2 text-sm font-medium text-white/60 cursor-pointer rounded-md transition-all peer-checked/gemini:bg-white/10 peer-checked/gemini:text-white peer-checked/gemini:shadow-sm hover:text-white/80">
                                Gemini
                            </label>
                            
                            <input type="radio" name="model_type" id="model_custom" value="custom_ai" class="peer/custom hidden">
                            <label for="model_custom" class="flex-1 text-center py-2 text-sm font-medium text-white/60 cursor-pointer rounded-md transition-all peer-checked/custom:bg-white/10 peer-checked/custom:text-white peer-checked/custom:shadow-sm hover:text-white/80">
                                Custom AI
                            </label>
                        </div>
                    </div>

                    <!-- Language Selection -->
                    <div class="mb-6">
                        <label for="languageSelect" class="block text-white/60 text-xs font-bold uppercase tracking-wider mb-2">Select Language</label>
                        <select id="languageSelect" name="language" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white text-sm font-medium focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500/50 transition-all cursor-pointer hover:bg-white/10">
                            <option value="any" selected>🌍 Any Language</option>
                            <option value="english">🇬🇧 English</option>
                            <option value="hindi">🇮🇳 Hindi</option>
                            <option value="korean">🇰🇷 Korean</option>
                            <option value="japanese">🇯🇵 Japanese</option>
                            <option value="spanish">🇪🇸 Spanish</option>
                        </select>
                    </div>

                    <button type="submit" id="analyzeBtn" class="w-full py-4 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-xl font-bold text-white shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 transform hover:scale-[1.02] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden">
                        <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                        <span class="relative flex items-center justify-center gap-2" id="btnText">
                            Generate Playlist
                        </span>
                        <span id="loader" class="loader ml-3 hidden"></span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Panel: Results -->
        <div class="w-full md:w-2/3 glass-card p-6 md:p-8 flex flex-col min-h-[500px] relative overflow-hidden">
            
            <!-- Empty State -->
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-white/30 pointer-events-none p-8 text-center">
                <div class="w-24 h-24 rounded-full bg-white/5 flex items-center justify-center mb-6 animate-pulse">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                    </svg>
                </div>
                <p class="text-2xl font-light">Your playlist awaits...</p>
                <p class="text-sm mt-2 opacity-60">Upload an image to start the vibe.</p>
            </div>

            <!-- Results Content -->
            <div id="resultsPanel" class="flex flex-col h-full hidden opacity-0 transition-opacity duration-700 ease-out">
                <div class="mb-6">
                    <h2 class="text-xs uppercase tracking-[0.2em] text-white/50 font-bold mb-3">Vibe Analysis</h2>
                    <p id="moodDescription" class="text-xl md:text-2xl font-light leading-tight text-white/90 mb-4"></p>
                    
                    <div class="flex flex-wrap gap-2 mb-4" id="genreTags">
                        <!-- Genres will be injected here -->
                    </div>

                    <!-- Vibe Tuner Controls -->
                    <div class="flex flex-wrap gap-2">
                        <button onclick="refineVibe('More Energetic')" class="px-3 py-1.5 bg-white/5 hover:bg-white/20 rounded-lg text-xs font-medium transition-colors border border-white/10">⚡ More Energy</button>
                        <button onclick="refineVibe('Chill Out')" class="px-3 py-1.5 bg-white/5 hover:bg-white/20 rounded-lg text-xs font-medium transition-colors border border-white/10">🧊 Chill Out</button>
                        <button onclick="refineVibe('Darker')" class="px-3 py-1.5 bg-white/5 hover:bg-white/20 rounded-lg text-xs font-medium transition-colors border border-white/10">🌑 Darker</button>
                        <button onclick="refineVibe('Happier')" class="px-3 py-1.5 bg-white/5 hover:bg-white/20 rounded-lg text-xs font-medium transition-colors border border-white/10">☀️ Happier</button>
                    </div>
                </div>
                
                <div class="flex-grow overflow-y-auto pr-2 -mr-2 space-y-3 custom-scrollbar" id="tracksList">
                    <!-- Spotify Embeds will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const imageInput = document.getElementById('imageInput');
        const previewImage = document.getElementById('previewImage');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const resultsPanel = document.getElementById('resultsPanel');
        const emptyState = document.getElementById('emptyState');
        const moodDescription = document.getElementById('moodDescription');
        const genreTags = document.getElementById('genreTags');
        const tracksList = document.getElementById('tracksList');
        
        // Camera Elements
        const cameraBtn = document.getElementById('cameraBtn');
        const cameraFeed = document.getElementById('cameraFeed');
        const cameraControls = document.getElementById('cameraControls');
        const captureBtn = document.getElementById('captureBtn');
        const closeCameraBtn = document.getElementById('closeCameraBtn');
        const flipCameraBtn = document.getElementById('flipCameraBtn');
        
        let cameraStream = null;
        let capturedImageFile = null;
        let currentFacingMode = 'environment'; // 'environment' for back camera, 'user' for front camera

        // Image Preview Logic
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                capturedImageFile = null; // Reset captured image
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.classList.remove('hidden');
                    cameraFeed.classList.add('hidden');
                    // Hide placeholder when image is shown
                    uploadPlaceholder.classList.add('opacity-0'); 
                }
                reader.readAsDataURL(file);
            }
        });
        
        // Helper function to start camera with specified facing mode
        async function startCamera(facingMode = 'environment') {
            try {
                // Check if getUserMedia is supported
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('❌ Camera access is not supported in this browser.\n\nPlease use a modern browser like Chrome, Firefox, or Safari.');
                    return;
                }
                
                // Check if we're on HTTPS or localhost
                const isSecureContext = window.isSecureContext;
                const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                
                if (!isSecureContext && !isLocalhost) {
                    const currentUrl = window.location.href;
                    const httpsUrl = currentUrl.replace('http://', 'https://');
                    
                    alert('🔒 Camera Requires HTTPS\n\n' +
                          'For security, mobile browsers require a secure (HTTPS) connection to access the camera.\n\n' +
                          '✅ Solutions:\n' +
                          '1. Use ngrok or similar tunneling service\n' +
                          '2. Set up local HTTPS certificate\n' +
                          '3. Upload image using the "Upload" button instead\n\n' +
                          'Current URL: ' + currentUrl);
                    return;
                }
                
                // Stop existing stream if any
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                
                // Request camera access with mobile-optimized constraints
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };
                
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraFeed.srcObject = cameraStream;
                
                // Show camera feed and controls
                cameraFeed.classList.remove('hidden');
                cameraControls.classList.remove('hidden');
                uploadPlaceholder.classList.add('opacity-0');
                previewImage.classList.add('hidden');
                
                currentFacingMode = facingMode;
                
            } catch (error) {
                console.error('Error accessing camera:', error);
                
                // Provide specific error messages
                let errorMessage = '❌ Unable to Access Camera\n\n';
                
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    errorMessage += '🚫 Camera permission was denied.\n\n' +
                                  '✅ How to fix:\n' +
                                  '1. Check your browser\'s address bar for camera permission\n' +
                                  '2. Click the camera icon and allow access\n' +
                                  '3. Refresh the page and try again\n' +
                                  '4. Check your device settings to ensure camera access is enabled for the browser';
                } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
                    errorMessage += '📷 No camera was found on this device.\n\n' +
                                  'Please use the "Upload" button to select an image from your gallery instead.';
                } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
                    errorMessage += '⚠️ Camera is already in use by another application.\n\n' +
                                  'Please close other apps using the camera and try again.';
                } else if (error.name === 'OverconstrainedError') {
                    errorMessage += '⚙️ Camera constraints not supported.\n\n' +
                                  'Your device camera may not support the requested settings. Trying with basic settings...';
                    
                    // Try again with simpler constraints
                    try {
                        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                        cameraFeed.srcObject = cameraStream;
                        cameraFeed.classList.remove('hidden');
                        cameraControls.classList.remove('hidden');
                        uploadPlaceholder.classList.add('opacity-0');
                        previewImage.classList.add('hidden');
                        currentFacingMode = facingMode;
                        return; // Success with simpler constraints
                    } catch (retryError) {
                        errorMessage = '❌ Camera access failed even with basic settings.\n\nPlease use the "Upload" button instead.';
                    }
                } else if (error.name === 'SecurityError') {
                    errorMessage += '🔒 Camera access blocked due to security policy.\n\n' +
                                  '✅ This usually means:\n' +
                                  '• You need HTTPS connection (not HTTP)\n' +
                                  '• Camera access is disabled in browser settings\n\n' +
                                  'Please use the "Upload" button to select an image instead.';
                } else {
                    errorMessage += 'Error: ' + error.message + '\n\n' +
                                  'Please try using the "Upload" button to select an image from your gallery instead.';
                }
                
                alert(errorMessage);
            }
        }
        
        // Camera Button Click
        cameraBtn.addEventListener('click', async function() {
            await startCamera(currentFacingMode);
        });
        
        // Flip Camera Button Click
        flipCameraBtn.addEventListener('click', async function() {
            const newFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            await startCamera(newFacingMode);
        });
        
        // Capture Photo
        captureBtn.addEventListener('click', function() {
            const canvas = document.createElement('canvas');
            canvas.width = cameraFeed.videoWidth;
            canvas.height = cameraFeed.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(cameraFeed, 0, 0);
            
            // Convert canvas to blob and create a file
            canvas.toBlob(function(blob) {
                // Create a File object from the blob
                capturedImageFile = new File([blob], 'camera-photo.jpg', { type: 'image/jpeg' });
                
                // Show preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.classList.remove('hidden');
                }
                reader.readAsDataURL(blob);
                
                // Close camera
                stopCamera();
            }, 'image/jpeg', 0.95);
        });
        
        // Close Camera
        closeCameraBtn.addEventListener('click', function() {
            stopCamera();
            uploadPlaceholder.classList.remove('opacity-0');
        });
        
        // Stop Camera Stream
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            cameraFeed.classList.add('hidden');
            cameraControls.classList.add('hidden');
            cameraFeed.srcObject = null;
        }

        // Form Submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Check if we have either a file upload or captured image
            const hasFileUpload = imageInput.files.length > 0;
            const hasCapturedImage = capturedImageFile !== null;
            
            if (!hasFileUpload && !hasCapturedImage) {
                alert('Please upload an image or capture one using the camera.');
                return;
            }
            
            setLoading(true);
            
            const formData = new FormData(form);
            
            // If we have a captured image, replace the file input with it
            if (hasCapturedImage) {
                formData.delete('image'); // Remove any existing file
                formData.append('image', capturedImageFile);
            }
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResults(data);
                } else {
                    alert('Error: ' + (data.error || 'Something went wrong'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while communicating with the server.');
            } finally {
                setLoading(false);
            }
        });

        async function refineVibe(modifier) {
            const currentMood = moodDescription.textContent;
            setLoading(true, `Tuning Vibe: ${modifier}...`);
            
            try {
                const response = await fetch('/refine', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        mood: currentMood,
                        modifier: modifier
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResults(data);
                } else {
                    alert('Error: ' + (data.error || 'Something went wrong'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while refining the vibe.');
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading, text = 'Analyzing Vibe...') {
            if (isLoading) {
                analyzeBtn.disabled = true;
                btnText.textContent = text;
                loader.classList.remove('hidden');
                resultsPanel.classList.add('hidden');
                resultsPanel.classList.remove('opacity-100');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('animate-pulse');
            } else {
                analyzeBtn.disabled = false;
                btnText.textContent = 'Generate Playlist';
                loader.classList.add('hidden');
                emptyState.classList.remove('animate-pulse');
            }
        }

        function displayResults(data) {
            emptyState.classList.add('hidden');
            
            // 1. Mood
            moodDescription.textContent = data.mood;
            
            // 2. Apply Color Palette to Background
            if (data.colors && data.colors.length >= 3) {
                const fluidBg = document.querySelector('.fluid-bg');
                const blob1 = document.querySelector('.blob-1');
                const blob2 = document.querySelector('.blob-2');
                const blob3 = document.querySelector('.blob-3');
                
                // Apply extracted colors to background blobs
                if (blob1 && data.colors[0]) {
                    blob1.style.background = `radial-gradient(circle, ${data.colors[0].hex}, ${data.colors[1]?.hex || data.colors[0].hex})`;
                }
                if (blob2 && data.colors[1]) {
                    blob2.style.background = `radial-gradient(circle, ${data.colors[1].hex}, ${data.colors[2]?.hex || data.colors[1].hex})`;
                }
                if (blob3 && data.colors[2]) {
                    blob3.style.background = `radial-gradient(circle, ${data.colors[2].hex}, ${data.colors[0]?.hex || data.colors[2].hex})`;
                }
                
                // Start mood particle animation with extracted colors
                startMoodAnimation(data.colors);
            }
            
            // 3. Genres
            genreTags.innerHTML = '';
            data.genres.forEach(genre => {
                const span = document.createElement('span');
                span.className = 'genre-tag px-4 py-1.5 bg-white/10 border border-white/20 rounded-full text-sm font-medium backdrop-blur-md hover:bg-white/20 transition-colors cursor-pointer';
                span.textContent = genre;
                genreTags.appendChild(span);
            });

            // 2. Tracks (Spotify Embeds)
            tracksList.innerHTML = '';
            data.tracks.forEach((track, index) => {
                // Create Embed Container
                const container = document.createElement('div');
                container.className = 'w-full bg-white/5 rounded-xl overflow-hidden hover:bg-white/10 transition-all border border-white/5 animate-fade-in-up shadow-sm hover:shadow-md';
                container.style.animationDelay = `${index * 100}ms`;

                if (track.id) {
                    // Use Spotify Embed
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://open.spotify.com/embed/track/${track.id}?utm_source=generator&theme=0`;
                    iframe.width = "100%";
                    iframe.height = "80";
                    iframe.frameBorder = "0";
                    iframe.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
                    iframe.loading = "lazy";
                    iframe.className = "rounded-xl"; 
                    
                    container.appendChild(iframe);
                } else {
                    // Fallback
                    container.innerHTML = `
                        <div class="p-4 flex items-center gap-4">
                            <img src="${track.album_art || 'https://via.placeholder.com/48'}" class="w-12 h-12 rounded object-cover opacity-50">
                            <div>
                                <h4 class="font-semibold text-white/70">${track.name}</h4>
                                <p class="text-sm text-white/50">${track.artist}</p>
                            </div>
                        </div>
                    `;
                }
                
                tracksList.appendChild(container);
            });

            resultsPanel.classList.remove('hidden');
            // Trigger reflow
            void resultsPanel.offsetWidth; 
            resultsPanel.classList.add('opacity-100');
        }
        
        // Mood Particle Animation System
        const canvas = document.getElementById('moodCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;
        let currentMoodColors = [
            { hex: '#667eea', rgb: { r: 102, g: 126, b: 234 } },
            { hex: '#764ba2', rgb: { r: 118, g: 75, b: 162 } },
            { hex: '#f093fb', rgb: { r: 240, g: 147, b: 251 } }
        ];
        
        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Particle class
        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
                this.fadeDelay = Math.random() * 600;
                this.fadeStart = Date.now() + this.fadeDelay;
                this.opacity = 0;
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.speed = 0.2 + Math.random() * 0.5;
                this.radius = 1 + Math.random() * 3;
                this.color = currentMoodColors[Math.floor(Math.random() * currentMoodColors.length)];
                this.angle = Math.random() * Math.PI * 2;
                this.drift = (Math.random() - 0.5) * 0.3;
            }
            
            update() {
                // Fade in
                if (Date.now() > this.fadeStart && this.opacity < 1) {
                    this.opacity += 0.02;
                }
                
                this.y -= this.speed;
                this.x += this.drift;
                this.angle += 0.01;
                
                // Reset if out of bounds
                if (this.y < -10) {
                    this.reset();
                    this.y = canvas.height + 10;
                    this.fadeDelay = Math.random() * 600;
                    this.fadeStart = Date.now() + this.fadeDelay;
                    this.opacity = 0;
                }
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity * 0.6;
                ctx.fillStyle = this.color.hex;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color.hex;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // Initialize particles
        function initParticles(count = 50) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        
        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            animationId = requestAnimationFrame(animate);
        }
        
        // Start mood animation
        function startMoodAnimation(colors) {
            if (colors && colors.length > 0) {
                currentMoodColors = colors;
            }
            
            // Reinitialize particles with new colors
            initParticles(60);
            
            // Start animation
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            animate();
        }
        
        // Initialize default animation
        initParticles(40);
        animate();
    </script>
